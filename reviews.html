  <main id="main"><section class="info-page-hero"><div class="container"><div class="section-kicker">Fictional demo reviews</div><h1 class="display-3 mt-2">Product reviews</h1><p class="lead text-muted-sw">All names, ratings, counts, and review text on this page are explicitly demo content used to show the review-browsing interface.</p></div></section><section class="section-space pt-4"><div class="container"><div class="row g-5"><div class="col-lg-4"><div class="summary-card sticky-lg-top" style="top:110px"><div class="display-4">4.7</div><div class="rating fs-5">★★★★★</div><p class="text-muted-sw">Based on fictional prototype reviews</p><div class="d-grid gap-2 mt-4"><div class="d-flex align-items-center gap-2"><span>5</span><div class="rating-bar flex-grow-1"><span style="width:72%"></span></div><small>72%</small></div><div class="d-flex align-items-center gap-2"><span>4</span><div class="rating-bar flex-grow-1"><span style="width:20%"></span></div><small>20%</small></div><div class="d-flex align-items-center gap-2"><span>3</span><div class="rating-bar flex-grow-1"><span style="width:6%"></span></div><small>6%</small></div><div class="d-flex align-items-center gap-2"><span>2</span><div class="rating-bar flex-grow-1"><span style="width:2%"></span></div><small>2%</small></div></div></div></div><div class="col-lg-8"><div class="row g-2 mb-3"><div class="col-md-4"><select id="reviewRating" class="form-select"><option value="all">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option></select></div><div class="col-md-4"><select id="reviewProduct" class="form-select"></select></div><div class="col-md-4"><select id="reviewSort" class="form-select"><option value="newest">Newest</option><option value="highest">Highest rated</option><option value="lowest">Lowest rated</option></select></div></div><div id="reviewCount" class="small text-muted-sw"></div><div id="reviewList"></div><button id="loadMore" class="
